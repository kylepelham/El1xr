<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">El1xr: Grand Theft Auto VI for Xbox Series, running on a Windows PC</title>
  <desc id="desc">Banner with a sunset over the sea, palm silhouettes and the El1xr wordmark. Headline figures: 24 to 25 fps settled at 4K on an RTX 5090, 0 refused GPU pipelines, about 31 to 33 seconds from launch to the first world frame, status playable as of 27 November 2026.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0720"/><stop offset=".38" stop-color="#2a0f4a"/>
      <stop offset=".72" stop-color="#8a1f6d"/><stop offset=".92" stop-color="#ff4f7e"/><stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1046"/><stop offset=".35" stop-color="#1a0a2e"/><stop offset="1" stop-color="#0b0618"/></linearGradient>
    <linearGradient id="sunbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset=".55" stop-color="#ffc2dc"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <mask id="sunmask"><rect width="900" height="360" fill="#fff"/><rect x="0" y="230" width="900" height="3.0" fill="#000"/><rect x="0" y="243" width="900" height="4.6" fill="#000"/><rect x="0" y="255" width="900" height="6.2" fill="#000"/><rect x="0" y="266" width="900" height="7.8" fill="#000"/><rect x="0" y="277" width="900" height="9.4" fill="#000"/><rect x="0" y="288" width="900" height="11.0" fill="#000"/><rect x="0" y="297" width="900" height="12.6" fill="#000"/><rect x="0" y="306" width="900" height="14.2" fill="#000"/><rect x="0" y="314" width="900" height="15.8" fill="#000"/><rect x="0" y="322" width="900" height="17.4" fill="#000"/><rect x="0" y="329" width="900" height="19.0" fill="#000"/><rect x="0" y="336" width="900" height="20.6" fill="#000"/></mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="neon" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".025"/></pattern>
    <clipPath id="heroclip"><rect width="900" height="360" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#heroclip)">
    <rect width="900" height="246" fill="url(#sky)"/>
    <circle cx="676" cy="236" r="134" fill="#ff3d8b" opacity=".35" filter="url(#soft)"/>
    <g class="rise"><circle cx="676" cy="236" r="104" fill="url(#sunbody)" mask="url(#sunmask)"/></g>
    <path d="M0 247L0 229L25 229L25 227L50 227L50 225L68 225L68 236L101 236L101 210L118 210L118 202L133 202L133 214L147 214L147 204L149 204L149 214L162 214L162 216L169 216L169 206L171 206L171 216L177 216L177 227L185 227L185 217L187 217L187 227L195 227L195 219L220 219L220 210L247 210L247 218L277 218L277 197L315 197L315 226L346 226L346 236L367 236L367 212L390 212L390 215L408 215L408 205L410 205L410 215L427 215L427 219L440 219L440 247Z" transform="translate(470,0)" fill="#1d0b33"/>
    <rect y="246" width="900" height="114" fill="url(#sea)"/>
    <rect y="246" width="900" height="1.5" fill="#ffb27a" opacity=".55"/>
    <g class="fade t3"><rect x="604" y="254" width="145" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.55"/><rect x="605" y="264" width="142" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.50"/><rect x="611" y="274" width="129" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.45"/><rect x="613" y="286" width="125" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.40"/><rect x="618" y="300" width="117" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.35"/><rect x="628" y="314" width="96" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.30"/><rect x="633" y="330" width="86" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.25"/><rect x="629" y="346" width="94" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.20"/><rect x="639" y="364" width="73" height="2.2" rx="1.1" fill="url(#sunbody)" opacity="0.15"/></g>
    <path d="M834.0 250Q828.8 145.5 812.5 60.0L819.5 60.0Q844.8 145.5 850.0 250Z" fill="#0b0616"/><path d="M816.0 60.0Q773.8 32.9 736.7 78.2Q772.0 43.2 816.0 60.0ZM816.0 60.0Q789.2 15.5 757.9 45.7Q782.5 23.5 816.0 60.0ZM816.0 60.0Q812.3 14.8 795.5 29.1Q802.5 18.4 816.0 60.0ZM816.0 60.0Q832.6 17.6 832.1 27.6Q822.5 14.9 816.0 60.0ZM816.0 60.0Q854.1 27.0 875.9 44.2Q847.4 19.0 816.0 60.0ZM816.0 60.0Q862.2 48.5 897.5 80.1Q860.4 38.2 816.0 60.0ZM816.0 60.0Q778.8 53.5 753.3 117.3Q782.4 63.3 816.0 60.0ZM816.0 60.0Q846.5 68.2 876.5 121.1Q850.1 58.3 816.0 60.0Z" fill="#0b0616"/><path d="M785.7 250Q789.3 173.0 807.3 110.0L812.7 110.0Q801.9 173.0 798.3 250Z" fill="#0b0616"/><path d="M810.0 110.0Q777.0 88.8 748.0 124.3Q775.5 96.8 810.0 110.0ZM810.0 110.0Q789.0 75.2 764.5 98.8Q783.8 81.4 810.0 110.0ZM810.0 110.0Q807.1 74.7 794.0 85.8Q799.4 77.5 810.0 110.0ZM810.0 110.0Q823.0 76.8 822.6 84.7Q815.1 74.7 810.0 110.0ZM810.0 110.0Q839.8 84.2 856.9 97.7Q834.6 77.9 810.0 110.0ZM810.0 110.0Q846.2 101.0 873.8 125.7Q844.8 92.9 810.0 110.0ZM810.0 110.0Q780.9 104.9 760.9 154.9Q783.7 112.6 810.0 110.0ZM810.0 110.0Q833.9 116.4 857.4 157.8Q836.7 108.7 810.0 110.0Z" fill="#0b0616"/><path d="M887.1 250Q885.5 189.5 881.9 140.0L886.1 140.0Q895.3 189.5 896.9 250Z" fill="#140822"/><path d="M884.0 140.0Q858.3 123.5 835.7 151.1Q857.2 129.8 884.0 140.0ZM884.0 140.0Q867.7 112.9 848.6 131.3Q863.6 117.8 884.0 140.0ZM884.0 140.0Q881.8 112.5 871.6 121.2Q875.8 114.7 884.0 140.0ZM884.0 140.0Q894.1 114.2 893.8 120.3Q888.0 112.5 884.0 140.0ZM884.0 140.0Q907.2 119.9 920.5 130.4Q903.1 115.0 884.0 140.0ZM884.0 140.0Q912.1 133.0 933.6 152.2Q911.0 126.7 884.0 140.0ZM884.0 140.0Q861.3 136.0 845.8 174.9Q863.5 142.0 884.0 140.0ZM884.0 140.0Q902.6 145.0 920.8 177.2Q904.8 139.0 884.0 140.0Z" fill="#140822"/>
    <rect width="900" height="360" fill="url(#scan)"/>
    <rect width="900" height="360" fill="none"/>
  </g>
  <rect x=".5" y=".5" width="899" height="359" rx="18" fill="none" stroke="#3a2458"/>

  <g class="fade">
    <text class="s up" x="46" y="54" font-size="11.5" font-weight="700" fill="#ffd0e4">Grand Theft Auto VI  /  Xbox Series 1.0.2.1  /  Windows PC</text>
  </g>
  <g class="fade t1">
    <text class="d" x="40" y="160" font-size="118" font-style="italic" letter-spacing="-1" fill="url(#word)" filter="url(#neon)">El1xr</text>
  </g>
  <g class="fade t2">
    <text class="s" x="46" y="198" font-size="17" fill="#fff4fa">The console version of GTA VI, running on a Windows PC.</text>
    <text class="s" x="46" y="222" font-size="14" fill="#f6d6e6">Game code runs natively. Kernel, D3D12.X and RDNA 2 shaders are translated.</text>
  </g>
  <g class="d" font-style="italic">
    <g class="fade t4"><text x="46" y="300" font-size="30" fill="#ffd36e">24-25 FPS</text><text class="s up" x="47" y="322" font-size="12" font-style="normal" fill="#ddd3ee">4K, RTX 5090, settled</text></g>
    <rect x="196" y="278" width="1" height="46" fill="#4a3070"/>
    <g class="fade t5"><text x="216" y="300" font-size="30" fill="#ffd36e">0</text><text class="s up" x="217" y="322" font-size="12" font-style="normal" fill="#ddd3ee">refused pipelines</text></g>
    <rect x="356" y="278" width="1" height="46" fill="#4a3070"/>
    <g class="fade t6"><text x="376" y="300" font-size="30" fill="#ffd36e">31-33 S</text><text class="s up" x="377" y="322" font-size="12" font-style="normal" fill="#ddd3ee">launch to world</text></g>
    <rect x="516" y="278" width="1" height="46" fill="#4a3070"/>
    <g class="fade t7"><text x="536" y="300" font-size="30" fill="#2de2e6">PLAYABLE</text><text class="s up" x="537" y="322" font-size="12" font-style="normal" fill="#ddd3ee">status, 27 Nov 2026</text></g>
  </g>
</svg>
