<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Where a 40 ms frame goes on the RTX 5090 (GTA VI, 4K, El1xr, 27 November 2026)</title>
  <desc id="desc">Stacked bar of GPU time per settled frame: the game's own rendering passes 22.8 ms, El1xr's own GPU work 7.0 ms, untimed 3.8 ms, GPU idle waiting for the CPU 6.2 ms, about 40 ms in all. The 30 fps line, 33.3 ms, falls inside the untimed part.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#1b0f33"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <linearGradient id="sunsetv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <clipPath id="cardclip"><rect width="900" height="320" rx="18"/></clipPath>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#3a1d4a"/><rect width="3" height="8" fill="#ff3d8b" fill-opacity=".45"/></pattern>
  </defs>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="320" fill="url(#cardbg)"/>
    <path d="M0 320L0 304L20 304L20 313L55 313L55 311L72 311L72 304L89 304L89 306L110 306L110 315L139 315L139 293L156 293L156 293L190 293L190 293L227 293L227 300L261 300L261 301L289 301L289 304L300 304L300 294L302 294L302 304L313 304L313 289L347 289L347 296L377 296L377 291L394 291L394 307L413 307L413 298L433 298L433 310L456 310L456 306L476 306L476 312L499 312L499 301L535 301L535 313L553 313L553 303L555 303L555 313L572 313L572 287L605 287L605 301L623 301L623 289L658 289L658 303L693 303L693 287L710 287L710 309L741 309L741 299L769 299L769 307L801 307L801 299L809 299L809 289L811 289L811 299L819 299L819 314L838 314L838 304L851 304L851 294L853 294L853 304L866 304L866 309L877 309L877 299L879 299L879 309L890 309L890 297L896 297L896 287L898 287L898 297L900 297L900 320Z" fill="#9b5cff" fill-opacity=".07"/>
    <rect width="900" height="4" fill="url(#sunset)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="319" rx="18" fill="none" stroke="#2c2048"/>
  <text class="s up" x="36" y="42" font-size="12.5" font-weight="700" fill="#ff3d8b">Frame budget, RTX 5090, 4K, 27 Nov 2026</text>
  <text class="d up" x="34" y="78" font-size="32" letter-spacing=".04em" fill="#f6eefe">Where a frame goes</text>
  <clipPath id="bar"><rect x="40" y="148" width="796" height="60" rx="6"/></clipPath>
  <g clip-path="url(#bar)">
  <rect class="grow t0" x="40" y="148" width="456" height="60" fill="#9b5cff"/>
  <rect class="grow t2" x="496" y="148" width="140" height="60" fill="#ff3d8b"/>
  <rect class="grow t4" x="636" y="148" width="76" height="60" fill="#ff8a3d"/>
  <rect class="grow t6" x="712" y="148" width="124" height="60" fill="url(#hatch)"/>
  </g>
  <g class="fade t7"><text class="d" x="268" y="175" font-size="17" letter-spacing=".05em" text-anchor="middle" fill="#ffffff">GAME'S OWN PASSES</text><text class="d" x="268" y="196" font-size="19" font-style="italic" text-anchor="middle" fill="#ffffff">22.8 ms</text><text class="d" x="566" y="175" font-size="15" letter-spacing=".05em" text-anchor="middle" fill="#ffffff">OUR GPU WORK</text><text class="d" x="566" y="196" font-size="17" font-style="italic" text-anchor="middle" fill="#ffffff">7.0 ms</text><text class="d" x="674" y="175" font-size="13" letter-spacing=".05em" text-anchor="middle" fill="#1a1028">UNTIMED</text><text class="d" x="674" y="196" font-size="15" font-style="italic" text-anchor="middle" fill="#1a1028">3.8 ms</text><text class="d" x="774" y="175" font-size="14" letter-spacing=".05em" text-anchor="middle" fill="#ffd0e4">GPU IDLE</text><text class="d" x="774" y="196" font-size="16" font-style="italic" text-anchor="middle" fill="#ffd0e4">6.2 ms</text></g>
  <g class="fade t8">
    <line x1="706" y1="126" x2="706" y2="218" stroke="#ffd36e" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text class="d" x="696" y="136" font-size="17" font-style="italic" text-anchor="end" fill="#ffd36e">30 FPS LINE: 33.3 MS</text>
    <text class="d" x="836" y="136" font-size="17" font-style="italic" text-anchor="end" fill="#f6eefe">NOW ~40 MS</text>
  </g>
  <rect x="40" y="214" width="1" height="6" fill="#4a3a66"/><text class="s" x="40" y="234" font-size="12" text-anchor="middle" fill="#a99bc6">0</text>
  <rect x="240" y="214" width="1" height="6" fill="#4a3a66"/><text class="s" x="240" y="234" font-size="12" text-anchor="middle" fill="#a99bc6">10</text>
  <rect x="440" y="214" width="1" height="6" fill="#4a3a66"/><text class="s" x="440" y="234" font-size="12" text-anchor="middle" fill="#a99bc6">20</text>
  <rect x="640" y="214" width="1" height="6" fill="#4a3a66"/><text class="s" x="640" y="234" font-size="12" text-anchor="middle" fill="#a99bc6">30</text>
  <rect x="840" y="214" width="1" height="6" fill="#4a3a66"/><text class="s" x="840" y="234" font-size="12" text-anchor="middle" fill="#a99bc6">40 ms</text>
  <rect x="40" y="268" width="12" height="12" rx="2" fill="#9b5cff"/><text class="s" x="60" y="278" font-size="13" fill="#ddd3ee">lighting, shadows, post-processing</text>
  <rect x="294" y="268" width="12" height="12" rx="2" fill="#ff3d8b"/><text class="s" x="314" y="278" font-size="13" fill="#ddd3ee">bounds checks, format copies, uploads</text>
  <rect x="566" y="268" width="12" height="12" rx="2" fill="#ff8a3d"/><text class="s" x="586" y="278" font-size="13" fill="#ddd3ee">not timed</text>
  <rect x="672" y="268" width="12" height="12" rx="2" fill="url(#hatch)"/><text class="s" x="692" y="278" font-size="13" fill="#ddd3ee">waiting for the CPU</text>
  <text class="s" x="864" y="78" font-size="13" text-anchor="end" fill="#a99bc6">GPU time per settled frame</text>
</svg>
