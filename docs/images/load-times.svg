  <text class="d fade t6" x="728" y="342" font-size="20" font-style="italic" fill="#ddd3ee">781-1048 ms</text>
  <rect class="grow t6" x="236" y="356" width="322" height="26" fill="url(#sunset)" opacity=".45"/>
  <rect class="grow t6" x="236" y="356" width="281" height="26" fill="url(#sunset)"/>
  <text class="d fade t6" x="570" y="378" font-size="28" font-style="italic" fill="#ffd36e">614-702 ms</text>
  <rect x="36" y="194" width="828" height="1" fill="#2c2048"/>
  <rect x="36" y="294" width="828" height="1" fill="#2c2048"/>
  <text class="s" x="36" y="408" font-size="13" fill="#a99bc6">RTX 5090, 4K, batch 5. Each before/after pair ran on one build. Less is better. Pale end of a bar: spread between runs.</text>
</svg>
