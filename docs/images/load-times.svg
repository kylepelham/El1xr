  <text class="s" x="222" y="273" font-size="13" text-anchor="end" fill="#a99bc6">now</text>
  <rect class="grow t3" x="236" y="226" width="560" height="18" fill="#3b2d58" opacity=".55"/>
  <rect class="grow t3" x="236" y="226" width="546" height="18" fill="#3b2d58"/>
  <text class="d fade t6" x="808" y="242" font-size="20" font-style="italic" fill="#ddd3ee">117-120 s</text>
  <rect class="grow t4" x="236" y="256" width="229" height="26" fill="url(#sunset)" opacity=".45"/>
  <rect class="grow t4" x="236" y="256" width="229" height="26" fill="url(#sunset)"/>
  <text class="d fade t6" x="477" y="278" font-size="28" font-style="italic" fill="#ffd36e">49 s</text>
