  <text class="d fade t6" x="690" y="178" font-size="28" font-style="italic" fill="#ffd36e">23.1-24.6 s</text>
  <text class="s up" x="36" y="218" font-size="12" font-weight="700" fill="#f6eefe">Diner dark flashes per run</text>
  <text class="s" x="864" y="218" font-size="12.5" text-anchor="end" fill="#a99bc6">TABLE_NULL_ONCE off / on</text>
  <text class="s" x="222" y="239" font-size="13" text-anchor="end" fill="#a99bc6">before</text>
  <text class="s" x="222" y="273" font-size="13" text-anchor="end" fill="#a99bc6">now</text>
  <rect class="grow t3" x="236" y="226" width="480" height="18" fill="#3b2d58" opacity=".55"/>
  <rect class="grow t3" x="236" y="226" width="303" height="18" fill="#3b2d58"/>
  <text class="d fade t6" x="728" y="242" font-size="20" font-style="italic" fill="#ddd3ee">12-19</text>
  <rect class="grow t4" x="236" y="256" width="3" height="26" fill="url(#sunset)" opacity=".45"/>
  <rect class="grow t4" x="236" y="256" width="3" height="26" fill="url(#sunset)"/>
  <text class="d fade t6" x="251" y="278" font-size="28" font-style="italic" fill="#ffd36e">0</text>
  <text class="s up" x="36" y="318" font-size="12" font-weight="700" fill="#f6eefe">World-entry frame</text>
  <text class="s" x="864" y="318" font-size="12.5" text-anchor="end" fill="#a99bc6">HEAP_WARM off / on, 2 pairs</text>
  <text class="s" x="222" y="339" font-size="13" text-anchor="end" fill="#a99bc6">before</text>
  <text class="s" x="222" y="373" font-size="13" text-anchor="end" fill="#a99bc6">now</text>
