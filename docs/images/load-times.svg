<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Load times before and after the 27 November 2026 update, RTX 5090, 4K</title>
  <desc id="desc">Before and after bars. Launch to the first world frame: 41 to 54 seconds before, 31 to 33 seconds now. Worst freeze when entering the world: 7.6 to 8.1 seconds before, 1.5 to 1.9 seconds now. Each bar spans the range across 200-second runs on the same machine.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#1b0f33"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy="1.05" r=".75"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".22"/><stop offset=".5" stop-color="#9b5cff" stop-opacity=".08"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <linearGradient id="sunsetv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <clipPath id="cardclip"><rect width="900" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="330" fill="url(#cardbg)"/>
    <rect width="900" height="330" fill="url(#glow)"/>
    <path d="M0 330L0 320L12 320L12 310L14 310L14 320L25 320L25 326L60 326L60 324L95 324L95 325L124 325L124 314L155 314L155 319L163 319L163 309L165 309L165 319L173 319L173 300L199 300L199 314L232 314L232 316L248 316L248 312L263 312L263 302L265 302L265 312L280 312L280 318L300 318L300 318L333 318L333 322L368 322L368 323L394 323L394 320L430 320L430 304L447 304L447 324L455 324L455 314L457 314L457 324L466 324L466 323L478 323L478 313L480 313L480 323L493 323L493 293L519 293L519 303L529 303L529 293L531 293L531 303L542 303L542 318L570 318L570 322L607 322L607 320L636 320L636 294L654 294L654 284L656 284L656 294L674 294L674 297L704 297L704 324L733 324L733 309L763 309L763 317L779 317L779 314L807 314L807 312L825 312L825 302L827 302L827 312L845 312L845 319L878 319L878 318L897 318L897 315L904 315L904 305L906 305L906 315L900 315L900 330Z" fill="#9b5cff" fill-opacity=".07"/>
    <rect width="900" height="4" fill="url(#sunset)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="329" rx="18" fill="none" stroke="#2c2048"/>
  <text class="s up" x="36" y="42" font-size="12.5" font-weight="700" fill="#ff3d8b">Load times, 27 Nov 2026</text>
  <text class="d up" x="34" y="78" font-size="32" letter-spacing=".04em" fill="#f6eefe">Faster into the world</text>
  <text class="s up" x="36" y="118" font-size="12" font-weight="700" fill="#f6eefe">Launch to first world frame</text>
  <text class="s" x="222" y="139" font-size="13" text-anchor="end" fill="#a99bc6">before</text>
  <text class="s" x="222" y="173" font-size="13" text-anchor="end" fill="#a99bc6">now</text>
  <rect class="grow t1" x="236" y="126" width="560" height="18" fill="#3b2d58" opacity=".55"/>
  <rect class="grow t1" x="236" y="126" width="425" height="18" fill="#3b2d58"/>
  <text class="d fade t6" x="808" y="142" font-size="20" font-style="italic" fill="#ddd3ee">41-54 s</text>
  <rect class="grow t2" x="236" y="156" width="342" height="26" fill="url(#sunset)" opacity=".45"/>
  <rect class="grow t2" x="236" y="156" width="321" height="26" fill="url(#sunset)"/>
  <text class="d fade t6" x="590" y="178" font-size="28" font-style="italic" fill="#ffd36e">31-33 s</text>
  <text class="s up" x="36" y="218" font-size="12" font-weight="700" fill="#f6eefe">Worst freeze entering the world</text>
  <text class="s" x="222" y="239" font-size="13" text-anchor="end" fill="#a99bc6">before</text>
  <text class="s" x="222" y="273" font-size="13" text-anchor="end" fill="#a99bc6">now</text>
  <rect class="grow t3" x="236" y="226" width="560" height="18" fill="#3b2d58" opacity=".55"/>
  <rect class="grow t3" x="236" y="226" width="525" height="18" fill="#3b2d58"/>
  <text class="d fade t6" x="808" y="242" font-size="20" font-style="italic" fill="#ddd3ee">7.6-8.1 s</text>
  <rect class="grow t4" x="236" y="256" width="131" height="26" fill="url(#sunset)" opacity=".45"/>
  <rect class="grow t4" x="236" y="256" width="104" height="26" fill="url(#sunset)"/>
  <text class="d fade t6" x="379" y="278" font-size="28" font-style="italic" fill="#ffd36e">1.5-1.9 s</text>
  <rect x="36" y="194" width="828" height="1" fill="#2c2048"/>
  <text class="s" x="36" y="308" font-size="13" fill="#a99bc6">RTX 5090, 4K, 200 s runs. Shorter is better. The pale end of each bar is the spread across runs.</text>
</svg>
