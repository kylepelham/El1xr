<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Batch 3: launch, settling and hitches before and after the pooled blocks, RTX 5090, 4K</title>
  <desc id="desc">Before and after bars from quiet back-to-back runs on the same build. Launch to the first world frame: 58 to 67 seconds before, 32 seconds now. Launch to settled play: 117 to 120 seconds before, 49 seconds now. Frames over 250 ms in the world: 51 to 74 before, 20 now. Before is two runs without pooled blocks; now is one run with them.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#1b0f33"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy="1.05" r=".75"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".22"/><stop offset=".5" stop-color="#9b5cff" stop-opacity=".08"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <linearGradient id="sunsetv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <clipPath id="cardclip"><rect width="900" height="430" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="430" fill="url(#cardbg)"/>
    <rect width="900" height="430" fill="url(#glow)"/>
    <path d="M0 430L0 420L12 420L12 410L14 410L14 420L25 420L25 426L60 426L60 424L95 424L95 425L124 425L124 414L155 414L155 419L163 419L163 409L165 409L165 419L173 419L173 400L199 400L199 414L232 414L232 416L248 416L248 412L263 412L263 402L265 402L265 412L280 412L280 418L300 418L300 418L333 418L333 422L368 422L368 423L394 423L394 420L430 420L430 404L447 404L447 424L455 424L455 414L457 414L457 424L466 424L466 423L478 423L478 413L480 413L480 423L493 423L493 393L519 393L519 403L529 403L529 393L531 393L531 403L542 403L542 418L570 418L570 422L607 422L607 420L636 420L636 394L654 394L654 384L656 384L656 394L674 394L674 397L704 397L704 424L733 424L733 409L763 409L763 417L779 417L779 414L807 414L807 412L825 412L825 402L827 402L827 412L845 412L845 419L878 419L878 418L897 418L897 415L904 415L904 405L906 405L906 415L900 415L900 430Z" fill="#9b5cff" fill-opacity=".07"/>
    <rect width="900" height="4" fill="url(#sunset)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="429" rx="18" fill="none" stroke="#2c2048"/>
  <text class="s up" x="36" y="42" font-size="12.5" font-weight="700" fill="#ff3d8b">Batch 3, 27 Nov 2026</text>
  <text class="d up" x="34" y="78" font-size="32" letter-spacing=".04em" fill="#f6eefe">Faster into the world</text>
