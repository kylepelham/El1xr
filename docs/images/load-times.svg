  <rect x="36" y="194" width="828" height="1" fill="#2c2048"/>
  <rect x="36" y="294" width="828" height="1" fill="#2c2048"/>
  <text class="s" x="36" y="408" font-size="13" fill="#a99bc6">RTX 5090, 4K, quiet 200 s runs, back to back. Less is better. Before: same build without pooled blocks, two runs (pale end: spread).</text>
