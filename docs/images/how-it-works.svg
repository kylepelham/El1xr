<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">How El1xr runs the game</title>
  <desc id="desc">Four lanes from the game, through El1xr, to the PC. The game's x86-64 code runs natively on the CPU. Console system calls go to El1xr's high-level emulation (HLE) of the console kernel and libraries, served by Windows. D3D12.X command lists are rebuilt as host Direct3D 12 on the GPU. RDNA 2 shader binaries are translated to DXIL, cached on disk, and run on the GPU.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#1b0f33"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <linearGradient id="sunsetv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <clipPath id="cardclip"><rect width="900" height="470" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="470" fill="url(#cardbg)"/>
    <path d="M0 470L0 452L27 452L27 451L47 451L47 464L61 464L61 454L63 454L63 464L77 464L77 449L101 449L101 458L127 458L127 455L163 455L163 443L179 443L179 446L196 446L196 459L233 459L233 446L269 446L269 435L284 435L284 460L322 460L322 434L338 434L338 424L340 424L340 434L356 434L356 462L379 462L379 432L401 432L401 435L434 435L434 431L461 431L461 455L484 455L484 444L503 444L503 460L530 460L530 453L566 453L566 445L602 445L602 440L616 440L616 456L641 456L641 455L656 455L656 445L658 445L658 455L673 455L673 438L690 438L690 428L692 428L692 438L710 438L710 446L738 446L738 439L769 439L769 461L793 461L793 463L810 463L810 453L845 453L845 449L862 449L862 439L864 439L864 449L881 449L881 465L900 465L900 470Z" fill="#9b5cff" fill-opacity=".07"/>
    <rect width="900" height="4" fill="url(#sunset)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="469" rx="18" fill="none" stroke="#2c2048"/>
  <text class="s up" x="36" y="42" font-size="12.5" font-weight="700" fill="#ff3d8b">Architecture</text>
  <text class="d up" x="34" y="78" font-size="32" letter-spacing=".04em" fill="#f6eefe">How it works</text>
  <text class="s up" x="36" y="122" font-size="12" font-weight="700" fill="#a99bc6">The game (your copy)</text>
  <text class="s up" x="310" y="122" font-size="12" font-weight="700" fill="#ff3d8b">El1xr</text>
  <text class="s up" x="704" y="122" font-size="12" font-weight="700" fill="#a99bc6">Your PC</text>
  <rect x="296" y="130" width="368" height="310" rx="12" fill="#ff3d8b" fill-opacity=".05" stroke="url(#sunset)" stroke-opacity=".7"/>
  <g class="fade t1">
    <rect x="36" y="140" width="216" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="52" y="168" font-size="19" fill="#f6eefe">x86-64 game code</text>
    <text class="s" x="52" y="188" font-size="13" fill="#a99bc6">the title's own executable</text>
    <path d="M254 171.0H300" stroke="#2de2e6" stroke-width="2"/><path d="M300 166.0l7 5l-7 5z" fill="#2de2e6"/>
    <rect x="310" y="140" width="340" height="62" rx="8" fill="#170f2b" stroke="#2de2e6" stroke-opacity=".75"/>
    <text class="d" x="326" y="168" font-size="19" fill="#2de2e6">Runs natively</text>
    <text class="s" x="326" y="188" font-size="13" fill="#ddd3ee">loaded and started as is, no CPU emulation</text>
  </g>
  <g class="fade t2">
    <rect x="36" y="216" width="216" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="52" y="244" font-size="19" fill="#f6eefe">Console system calls</text>
    <text class="s" x="52" y="264" font-size="13" fill="#a99bc6">kernel and GDK libraries</text>
    <path d="M254 247.0H300" stroke="#9b5cff" stroke-width="2"/><path d="M300 242.0l7 5l-7 5z" fill="#9b5cff"/>
    <rect x="310" y="216" width="340" height="62" rx="8" fill="#170f2b" stroke="#9b5cff" stroke-opacity=".75"/>
    <text class="d" x="326" y="244" font-size="19" fill="#9b5cff">HLE kernel</text>
    <text class="s" x="326" y="264" font-size="13" fill="#ddd3ee">memory, threads, files and services</text>
  </g>
  <g class="fade t3">
    <rect x="36" y="292" width="216" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="52" y="320" font-size="19" fill="#f6eefe">D3D12.X commands</text>
    <text class="s" x="52" y="340" font-size="13" fill="#a99bc6">the console's graphics API</text>
    <path d="M254 323.0H300" stroke="#ff3d8b" stroke-width="2"/><path d="M300 318.0l7 5l-7 5z" fill="#ff3d8b"/>
    <rect x="310" y="292" width="340" height="62" rx="8" fill="#170f2b" stroke="#ff3d8b" stroke-opacity=".75"/>
    <text class="d" x="326" y="320" font-size="19" fill="#ff3d8b">Host Direct3D 12</text>
    <text class="s" x="326" y="340" font-size="13" fill="#ddd3ee">command lists and resources rebuilt</text>
  </g>
  <g class="fade t4">
    <rect x="36" y="368" width="216" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="52" y="396" font-size="19" fill="#f6eefe">RDNA 2 shaders</text>
    <text class="s" x="52" y="416" font-size="13" fill="#a99bc6">compiled for the console GPU</text>
    <path d="M254 399.0H300" stroke="#ff8a3d" stroke-width="2"/><path d="M300 394.0l7 5l-7 5z" fill="#ff8a3d"/>
    <rect x="310" y="368" width="340" height="62" rx="8" fill="#170f2b" stroke="#ff8a3d" stroke-opacity=".75"/>
    <text class="d" x="326" y="396" font-size="19" fill="#ff8a3d">Translated to DXIL</text>
    <text class="s" x="326" y="416" font-size="13" fill="#ddd3ee">26,148 programs, cached on disk</text>
  </g>
  <g class="fade t5">
    <path d="M652 171.0H694" stroke="#2de2e6" stroke-width="2"/><path d="M694 166.0l7 5l-7 5z" fill="#2de2e6"/>
    <rect x="704" y="140" width="160" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="720" y="168" font-size="19" fill="#f6eefe">CPU</text>
    <text class="s" x="720" y="188" font-size="13" fill="#a99bc6">Ryzen 9 9950X3D</text>
  </g>
  <g class="fade t6">
    <path d="M652 247.0H694" stroke="#9b5cff" stroke-width="2"/><path d="M694 242.0l7 5l-7 5z" fill="#9b5cff"/>
    <rect x="704" y="216" width="160" height="62" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="720" y="244" font-size="19" fill="#f6eefe">Windows</text>
    <text class="s" x="720" y="264" font-size="13" fill="#a99bc6">Windows 10 or 11</text>
  </g>
  <g class="fade t7">
    <path d="M652 323.0C676 323.0 676 353.0 694 353.0" fill="none" stroke="#ff3d8b" stroke-width="2"/>
    <path d="M652 399.0C676 399.0 676 369.0 694 369.0" fill="none" stroke="#ff8a3d" stroke-width="2"/>
    <path d="M694 348.0l7 5l-7 5z" fill="#ff3d8b"/><path d="M694 364.0l7 5l-7 5z" fill="#ff8a3d"/>
    <rect x="704" y="292" width="160" height="138" rx="8" fill="#170f2b" stroke="#2c2048"/>
    <text class="d" x="720" y="355.0" font-size="19" fill="#f6eefe">GPU</text>
    <text class="s" x="720" y="374.0" font-size="13" fill="#a99bc6">RTX 5090, Direct3D 12</text>
    <text class="s" x="720" y="392.0" font-size="13" fill="#a99bc6">Shader Model 6.6</text>
  </g>
</svg>
