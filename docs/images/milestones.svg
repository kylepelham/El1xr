<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img" aria-labelledby="title desc">
  <title id="title">El1xr milestones as of 28 November 2026</title>
  <desc id="desc">Six-step progress bar. Done: boots, main menu and in-game (all by 24 November 2026), playable (27 November 2026; now 21.6 to 26.0 fps at 4K on an RTX 5090 in quiet batch 5 runs). Next: 30 fps, about 87 percent of the way at the best quiet run's 26.0 fps. Ahead: stable, with no device loss but visual faults left.</desc>
  <style>
    .d{font-family:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",Impact,sans-serif;font-weight:600}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .up{text-transform:uppercase;letter-spacing:.08em}
    .fade{animation:fade .7s ease-out both}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
    .t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}
    .t5{animation-delay:.75s}.t6{animation-delay:.9s}.t7{animation-delay:1.1s}.t8{animation-delay:1.4s}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade,.grow,.rise{animation:none}}
  </style>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#1b0f33"/></linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <linearGradient id="sunsetv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".35" stop-color="#ff8a3d"/><stop offset=".7" stop-color="#ff3d8b"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <clipPath id="cardclip"><rect width="900" height="276" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cardclip)">
    <rect width="900" height="276" fill="url(#cardbg)"/>
    <path d="M0 276L0 260L18 260L18 268L43 268L43 262L77 262L77 272L97 272L97 270L125 270L125 266L133 266L133 256L135 256L135 266L144 266L144 252L182 252L182 270L211 270L211 268L237 268L237 266L260 266L260 242L277 242L277 260L304 260L304 269L322 269L322 245L342 245L342 241L379 241L379 251L412 251L412 254L429 254L429 239L447 239L447 258L471 258L471 236L494 236L494 267L509 267L509 253L547 253L547 245L574 245L574 252L603 252L603 265L621 265L621 260L657 260L657 268L667 268L667 258L669 258L669 268L679 268L679 248L712 248L712 252L743 252L743 260L780 260L780 257L817 257L817 263L842 263L842 269L859 269L859 259L861 259L861 269L877 269L877 257L900 257L900 276Z" fill="#9b5cff" fill-opacity=".07"/>
    <rect width="900" height="4" fill="url(#sunset)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="275" rx="18" fill="none" stroke="#2c2048"/>
  <text class="s up" x="36" y="42" font-size="12.5" font-weight="700" fill="#ff3d8b">Status, 28 Nov 2026</text>
  <text class="d up" x="34" y="78" font-size="32" letter-spacing=".04em" fill="#f6eefe">Milestones</text>
  <g class="fade t1">
    <text class="d" x="36.0" y="116" font-size="15" font-style="italic" fill="#ff3d8b">01</text>
    <text class="d" x="36.0" y="142" font-size="25" fill="#f6eefe">Boots</text>
    <rect x="36.0" y="156" width="129.7" height="12" rx="3" fill="#251a40"/><rect class="grow t1" x="36.0" y="156" width="129.7" height="12" rx="3" fill="url(#sunset)"/>
    <text class="s" x="36.0" y="196" font-size="13" fill="#ddd3ee">x86-64 code runs</text>
    <text class="s" x="36.0" y="214" font-size="13" fill="#ddd3ee">natively</text>
    <text class="s up" x="36.0" y="244" font-size="11.5" font-weight="700" fill="#2de2e6">by 24 Nov 2026</text>
  </g>
  <g class="fade t2">
    <text class="d" x="175.7" y="116" font-size="15" font-style="italic" fill="#ff3d8b">02</text>
    <text class="d" x="175.7" y="142" font-size="25" fill="#f6eefe">Main menu</text>
    <rect x="175.7" y="156" width="129.7" height="12" rx="3" fill="#251a40"/><rect class="grow t2" x="175.7" y="156" width="129.7" height="12" rx="3" fill="url(#sunset)"/>
    <text class="s" x="175.7" y="196" font-size="13" fill="#ddd3ee">profile, settings,</text>
