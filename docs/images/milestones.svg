    <rect x="455.0" y="156" width="129.7" height="12" rx="3" fill="#251a40"/><rect class="grow t4" x="455.0" y="156" width="129.7" height="12" rx="3" fill="url(#sunset)"/>
    <text class="s" x="455.0" y="196" font-size="13" fill="#ddd3ee">21.6-26.0 fps at 4K,</text>
    <text class="s" x="455.0" y="214" font-size="13" fill="#ddd3ee">missions completed</text>
    <text class="s up" x="455.0" y="244" font-size="11.5" font-weight="700" fill="#2de2e6">27 Nov 2026</text>
  </g>
  <g class="fade t5">
    <text class="d" x="594.7" y="116" font-size="15" font-style="italic" fill="#ffd36e">05</text>
    <text class="d" x="594.7" y="142" font-size="25" fill="#f6eefe">30 fps</text>
    <rect x="594.7" y="156" width="129.7" height="12" rx="3" fill="#251a40"/><rect class="grow t5" x="594.7" y="156" width="112.4" height="12" rx="3" fill="#ffd36e"/>
    <text class="s" x="594.7" y="196" font-size="13" fill="#ddd3ee">now 21.6-26.0 fps,</text>
    <text class="s" x="594.7" y="214" font-size="13" fill="#ddd3ee">goal 33.3 ms a frame</text>
    <text class="s up" x="594.7" y="244" font-size="11.5" font-weight="700" fill="#ffd36e">next</text>
  </g>
  <g class="fade t6">
    <text class="d" x="734.3" y="116" font-size="15" font-style="italic" fill="#a99bc6">06</text>
    <text class="d" x="734.3" y="142" font-size="25" fill="#a99bc6">Stable</text>
    <rect x="734.3" y="156" width="129.7" height="12" rx="3" fill="#251a40"/>
    <text class="s" x="734.3" y="196" font-size="13" fill="#ddd3ee">no device loss,</text>
