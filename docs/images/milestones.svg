    <text class="s up" x="175.7" y="244" font-size="11.5" font-weight="700" fill="#2de2e6">by 24 Nov 2026</text>
  </g>
  <g class="fade t3">
    <text class="d" x="315.3" y="116" font-size="15" font-style="italic" fill="#ff3d8b">03</text>
    <text class="d" x="315.3" y="142" font-size="25" fill="#f6eefe">In-game</text>
    <rect x="315.3" y="156" width="129.7" height="12" rx="3" fill="#251a40"/><rect class="grow t3" x="315.3" y="156" width="129.7" height="12" rx="3" fill="url(#sunset)"/>
    <text class="s" x="315.3" y="196" font-size="13" fill="#ddd3ee">the player moves</text>
    <text class="s" x="315.3" y="214" font-size="13" fill="#ddd3ee">in the world</text>
    <text class="s up" x="315.3" y="244" font-size="11.5" font-weight="700" fill="#2de2e6">by 24 Nov 2026</text>
  </g>
